<!DOCTYPE html>
<!-- INTERACTIVE JUDGE TOOL — index.html (the page layout).
     Open this file in a browser to use the tool.
     The whole chart is one landscape page that shrinks or grows to
     fit the screen (see fitToScreen in app.js). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Interactive Judge Tool</title>
  <!-- CHANGED: AUTOMATIC FRESH FILES. Every time the page opens, a new number
       (the current time) is added to each file name, e.g. styles.css?v=1730650000000.
       The browser sees a "new" file and always downloads the newest copy from
       GitHub instead of using an old saved one. Nothing to update by hand.
       The files load in the same order and at the same moment as before. -->
  <script>
    window.FRESH_V = Date.now();
    document.write('<link rel="stylesheet" href="styles.css?v=' + window.FRESH_V + '">');
  </script>
</head>
<body>
  <!-- "viewport" keeps the space for the scaled page; "page" is the chart -->
  <div class="viewport" id="viewport">
    <main class="page" id="page">

      <!-- Fighter names -->
      <header class="fighters">
        <div class="corner red">Red Fighter</div>
        <div class="corner blue">Blue Fighter</div>
      </header>

      <!-- Main needle: Effective Strikes / Effective Grappling -->
      <section id="main-section"></section>

      <hr class="divider">

      <!-- (10-8) Guidelines: Damage/Impact, Dominance, Duration -->
      <section id="teneight-panel">
        <div class="ten-head">
          <span class="tag">(10-8) Guidelines</span>
        </div>
        <p class="guide-line" id="teneight-intro"></p>
        <p class="guide-line" id="teneight-rule"></p>
        <div id="teneight-sliders"></div>
      </section>

      <!-- Effective Aggressiveness + Cage Control -->
      <section id="backup-section"></section>

      <footer class="page-foot">
        <div class="foot-left">
          <button type="button" class="reset" id="reset">Reset</button>
          <!-- CHANGED: round length choice. Clicking the other one clears Duration. -->
          <span class="roundlen" id="roundlen" role="group" aria-label="Round length">
            <button type="button" class="rl-btn" data-min="5">5 min</button>
            <button type="button" class="rl-btn" data-min="3">3 min</button>
          </span>
          <!-- CHANGED: settings (gear) button, to the right of "3 min".
               It opens the Settings popup where technique values can be changed. -->
          <button type="button" class="settings-btn" id="settings" aria-label="Settings — technique values" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          </button>
        </div>
        <span></span>  <!-- keeps Reset on the left and the credit on the right -->
        <span class="credit">Created By: Tom Supnet</span>
      </footer>
    </main>
  </div>

  <!-- Popup window for hyperlinked words (outside the page so it is never shrunk) -->
  <div class="popup-overlay" id="popup" hidden>
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title">
      <button type="button" class="popup-close" id="popup-close" aria-label="Close">×</button>
      <h2 id="popup-title"></h2>
      <div id="popup-body"></div>
    </div>
  </div>

  <!-- CHANGED: the three program files, each with the automatic fresh number (see top of file) -->
  <script>
    ["config.js", "definitions.js", "app.js"].forEach(function (f) {
      document.write('<script src="' + f + '?v=' + window.FRESH_V + '"><\/script>');
    });
  </script>
</body>
</html>
